{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#1f4e79">
    <title>Marcación de Asistencia · SD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; min-height: 100vh; }
        .camera-frame {
            aspect-ratio: 3 / 4;
            background: #000;
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
        }
        .camera-frame video, .camera-frame canvas, .camera-frame img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .face-guide {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .face-guide::after {
            content: ''; width: 65%; aspect-ratio: 3 / 4;
            border: 3px dashed rgba(255,255,255,0.5);
            border-radius: 50% / 40%;
        }
        .success-overlay {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 2rem;
            animation: fadein 0.3s ease;
        }
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
            70% { box-shadow: 0 0 0 30px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .pulse { animation: pulse-ring 1.5s infinite; }
    </style>
</head>
<body class="flex flex-col items-center p-4">
    {% csrf_token %}
    <div class="w-full max-w-sm">
        <header class="text-center mb-4">
            <h1 class="text-xl font-bold">Marcación de Asistencia</h1>
            <p class="text-sm text-slate-400">S.D. S.A.S. · Reconocimiento facial</p>
        </header>

        <div id="status-card" class="hidden mb-3 p-3 rounded-lg text-sm"></div>

        <div class="camera-frame mb-3" id="camera-wrap">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" class="hidden"></canvas>
            <img id="preview" class="hidden" alt="">
            <div class="face-guide" id="guide"></div>
        </div>

        <div class="flex gap-2 mb-3">
            <button id="btn-checkin" type="button"
                    class="btn btn-success flex-1 text-base">
                Entrada
            </button>
            <button id="btn-checkout" type="button"
                    class="btn btn-error flex-1 text-base">
                Salida
            </button>
        </div>

        <div id="loading" class="hidden text-center py-3">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <p class="text-sm mt-2">Verificando rostro…</p>
        </div>

        <button id="btn-retry" type="button"
                class="btn btn-ghost w-full hidden">
            Tomar otra foto
        </button>

        <p class="text-xs text-slate-500 text-center mt-4" id="gps-info">
            GPS: solicitando…
        </p>
    </div>

    <!-- Pantalla de éxito a pantalla completa -->
    <div id="success-overlay" class="hidden success-overlay">
        <div id="success-icon" class="w-32 h-32 rounded-full bg-success flex items-center justify-center text-6xl text-success-content mb-6 pulse">
            ✓
        </div>
        <h2 id="success-kind" class="text-3xl font-bold mb-2">Entrada</h2>
        <p id="success-name" class="text-2xl text-center mb-1"></p>
        <p id="success-cargo" class="text-sm text-slate-400 mb-4"></p>
        <div class="text-center mb-6">
            <div id="success-time" class="text-5xl font-mono font-bold"></div>
            <div id="success-date" class="text-sm text-slate-400"></div>
        </div>
        <p id="success-similarity" class="text-xs text-slate-500 mb-6"></p>
        <button id="btn-success-close" class="btn btn-primary btn-lg">
            Listo (cerrará en <span id="countdown">5</span>s)
        </button>
    </div>

<script>
(function() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const guide = document.getElementById('guide');
    const btnIn = document.getElementById('btn-checkin');
    const btnOut = document.getElementById('btn-checkout');
    const btnRetry = document.getElementById('btn-retry');
    const loading = document.getElementById('loading');
    const statusCard = document.getElementById('status-card');
    const gpsInfo = document.getElementById('gps-info');
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

    const successOverlay = document.getElementById('success-overlay');
    const successIcon = document.getElementById('success-icon');
    const successKind = document.getElementById('success-kind');
    const successName = document.getElementById('success-name');
    const successCargo = document.getElementById('success-cargo');
    const successTime = document.getElementById('success-time');
    const successDate = document.getElementById('success-date');
    const successSimilarity = document.getElementById('success-similarity');
    const btnSuccessClose = document.getElementById('btn-success-close');
    const countdownEl = document.getElementById('countdown');

    let stream = null;
    let coords = { latitude: null, longitude: null };
    let countdownTimer = null;

    // GPS opcional
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => {
                coords.latitude = pos.coords.latitude.toFixed(7);
                coords.longitude = pos.coords.longitude.toFixed(7);
                gpsInfo.textContent = `GPS: ${coords.latitude}, ${coords.longitude}`;
            },
            err => { gpsInfo.textContent = 'GPS: no disponible'; },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    } else {
        gpsInfo.textContent = 'GPS: no soportado';
    }

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } },
                audio: false,
            });
            video.srcObject = stream;
            video.classList.remove('hidden');
            preview.classList.add('hidden');
            guide.classList.remove('hidden');
            btnRetry.classList.add('hidden');
            statusCard.classList.add('hidden');
        } catch (err) {
            showStatus('error', 'No se pudo acceder a la cámara: ' + err.message);
        }
    }

    function captureSelfie() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        return new Promise(resolve => {
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
        });
    }

    function showStatus(kind, msg) {
        statusCard.classList.remove('hidden', 'bg-success', 'bg-error', 'bg-warning', 'text-success-content', 'text-error-content', 'text-warning-content');
        if (kind === 'success') {
            statusCard.classList.add('bg-success', 'text-success-content');
        } else if (kind === 'warning') {
            statusCard.classList.add('bg-warning', 'text-warning-content');
        } else {
            statusCard.classList.add('bg-error', 'text-error-content');
        }
        statusCard.innerHTML = msg;
    }

    function vibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function showSuccess(data) {
        successKind.textContent = data.kind === 'check_in' ? 'Entrada registrada' : 'Salida registrada';
        successIcon.className = 'w-32 h-32 rounded-full flex items-center justify-center text-6xl mb-6 pulse ' +
            (data.kind === 'check_in' ? 'bg-success text-success-content' : 'bg-error text-error-content');
        successIcon.textContent = data.kind === 'check_in' ? '✓' : '⏱';
        successName.textContent = data.employee_name;
        successCargo.textContent = data.cargo || '';
        successTime.textContent = data.time;
        successDate.textContent = data.date;
        successSimilarity.textContent = `Confianza: ${data.similarity.toFixed(1)}%`;
        successOverlay.classList.remove('hidden');
        vibrate([100, 50, 100]);

        let secs = 5;
        countdownEl.textContent = secs;
        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
            secs -= 1;
            countdownEl.textContent = secs;
            if (secs <= 0) {
                clearInterval(countdownTimer);
                closeSuccess();
            }
        }, 1000);
    }

    function closeSuccess() {
        clearInterval(countdownTimer);
        successOverlay.classList.add('hidden');
        startCamera();
    }

    btnSuccessClose.addEventListener('click', closeSuccess);

    async function submitCheck(kind) {
        if (!stream) {
            showStatus('error', 'Cámara no inicializada.');
            return;
        }
        loading.classList.remove('hidden');
        btnIn.disabled = btnOut.disabled = true;
        statusCard.classList.add('hidden');

        const blob = await captureSelfie();

        // Preview
        preview.src = URL.createObjectURL(blob);
        video.classList.add('hidden');
        preview.classList.remove('hidden');
        guide.classList.add('hidden');

        const fd = new FormData();
        fd.append('selfie', blob, 'selfie.jpg');
        fd.append('kind', kind);
        if (coords.latitude) fd.append('latitude', coords.latitude);
        if (coords.longitude) fd.append('longitude', coords.longitude);

        try {
            const resp = await fetch(window.location.pathname, {
                method: 'POST',
                headers: { 'X-CSRFToken': csrf },
                body: fd,
            });
            const data = await resp.json();
            loading.classList.add('hidden');

            if (data.ok) {
                showSuccess({ ...data, kind });
            } else {
                btnRetry.classList.remove('hidden');
                vibrate([300, 100, 300]);
                showStatus('warning', `<strong>No se pudo registrar.</strong><br>${data.error || 'Error desconocido.'}`);
            }
        } catch (err) {
            loading.classList.add('hidden');
            btnRetry.classList.remove('hidden');
            vibrate([300, 100, 300]);
            showStatus('error', 'Error de red: ' + err.message);
        } finally {
            btnIn.disabled = btnOut.disabled = false;
        }
    }

    btnIn.addEventListener('click', () => submitCheck('check_in'));
    btnOut.addEventListener('click', () => submitCheck('check_out'));
    btnRetry.addEventListener('click', startCamera);

    startCamera();
})();
</script>
</body>
</html>
