# =============================================================================
# SD LMS - CI Pipeline
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_VERSION: "16"

jobs:
  # ---------------------------------------------------------------------------
  # Code Quality
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: [gcp, linux-amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --user --break-system-packages --upgrade pip
          python3 -m pip install --user --break-system-packages ruff mypy django-stubs djangorestframework-stubs types-redis types-pytz

      - name: Run Ruff linter
        run: python3 -m ruff check .

      - name: Run Ruff formatter check
        run: python3 -m ruff format --check .

      - name: Run mypy
        run: python3 -m mypy . --ignore-missing-imports
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python 3.12)
    runs-on: [gcp, linux-amd64]
    needs: lint

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-secret-key-for-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --break-system-packages --upgrade pip
          python3 -m pip install --user --break-system-packages -r requirements/test.txt

      - name: Run migrations
        run: python3 manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          python3 -m pytest --cov=apps --cov-report=xml --cov-report=html -n auto

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ---------------------------------------------------------------------------
  # Security Check
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: [gcp, linux-amd64]
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --user --break-system-packages --upgrade pip
          python3 -m pip install --user --break-system-packages safety bandit

      - name: Run safety check
        run: python3 -m safety check -r requirements/base.txt --full-report

      - name: Run bandit security linter
        run: python3 -m bandit -r apps/ -ll -ii --skip B703,B308,B314

  # ---------------------------------------------------------------------------
  # Build Docker Image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: [gcp, linux-amd64]
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          context: .
          target: production
          push: false
          tags: sd-lms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
