<!DOCTYPE html>
<!--
    PLACEHOLDER minimal — sub-item A6 reemplaza este archivo con el layout
    standalone real (Tailwind CDN + DaisyUI + Alpine dark-mode, espejo de
    templates/accounts/base_auth.html) y el branding "portal de SD - Cursos".
    Existe acá solo para que las vistas de A5 (lista/nuevo/detalle) tengan un
    template real para renderizar y sus tests puedan correr.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}portal de SD - Cursos{% endblock %}</title>
</head>
<body>
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
