# =============================================================================
# SD LMS - Pre-commit Configuration (SIMPLIFICADO)
# =============================================================================
# IMPORTANTE: Esta configuración está optimizada para MÁXIMA ESTABILIDAD
# Los checks más estrictos se ejecutan en CI/CD, no localmente
#
# Si aún así tienes problemas, ejecuta:
#   git commit --no-verify
#
# Run: pre-commit install
# Manual run: pre-commit run --all-files

default_language_version:
  python: python3.11

repos:
  # =========================================================================
  # CHECKS BÁSICOS Y RÁPIDOS - Estos siempre corren
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Limpieza básica
      - id: trailing-whitespace
        exclude: ^.*\.(md|rst)$
      - id: end-of-file-fixer

      # Validación de sintaxis
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml

      # Seguridad básica
      - id: detect-private-key
      - id: check-merge-conflict

  # =========================================================================
  # PYTHON FORMATTING - Rápido y seguro
  # =========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.1
    hooks:
      - id: ruff-format
        # Solo formatea, no valida. Mucho más rápido

# ============================================================================
# DISABLED EN LOCAL - Se ejecutan en CI/CD (GitHub Actions)
# ============================================================================
#
# ❌ DISABLED: Ruff linting (demasiado estricto)
#    → Se ejecuta en CI/CD
# - repo: https://github.com/astral-sh/ruff-pre-commit
#   hooks:
#     - id: ruff
#       args: [--fix]
#
# ❌ DISABLED: MyPy (problemas de dependencias)
#    → Se ejecuta en CI/CD via pytest
#
# ❌ DISABLED: DjLint (MUY lento)
#    → Se ejecuta en CI/CD
#
# ❌ DISABLED: Bandit (security checks)
#    → Se ejecuta en CI/CD
#
# ❌ DISABLED: Django-upgrade (modifications)
#    → Se ejecuta en CI/CD
#
# ❌ DISABLED: Commitizen (commit message validation)
#    → Se ejecuta en CI/CD

ci:
  autofix_commit_msg: "🔧 auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: develop
  autoupdate_commit_msg: "⬆️ update pre-commit hooks"
  autoupdate_schedule: weekly
